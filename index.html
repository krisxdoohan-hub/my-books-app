<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>星閱 - 手機小說閱讀器</title>
    
    <!-- PWA Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3145/3145765.png">

    <!-- CSS & Icons -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Libraries for EPUB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jschardet/3.2.0/jschardet.min.js"></script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* 安全區域適配：使用 max() 防止環境變數為 0 時 UI 貼緊邊緣 */
        #header {
            padding-top: max(1rem, env(safe-area-inset-top));
        }
        #reader-header {
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }
        #library {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        #reader-settings {
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
        #txt-viewer {
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
        #epub-nav {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        .reader-content p {
            margin-bottom: 1.5em;
            line-height: 1.8;
        }
        /* 隱藏捲軸但保持滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 針對 Z Flip 等長螢幕優化 */
        @media (min-aspect-ratio: 1/2) {
            .max-w-phone {
                max-width: 480px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-sky-500/30 overflow-hidden">

    <!-- 主容器 -->
    <div id="app" class="h-screen w-full flex flex-col max-w-phone relative bg-slate-900 mx-auto">
        
        <!-- 頂部導覽列 -->
        <header id="header" class="flex items-center justify-between px-4 py-4 border-b border-slate-800 shrink-0">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="ph-bold ph-book-open text-sky-400"></i>
                星閱
            </h1>
            <div class="flex gap-4">
                <button onclick="syncCloudFiles()" class="p-2 hover:bg-slate-800 rounded-full transition-colors group relative" title="雲端雙向同步">
                    <i class="ph-bold ph-arrows-merge text-xl text-slate-400" id="sync-icon"></i>
                    <span class="absolute -top-1 -right-1 flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
                    </span>
                </button>
                <button onclick="toggleCloudConfig()" class="p-2 hover:bg-slate-800 rounded-full transition-colors" title="設定">
                    <i class="ph-bold ph-gear text-xl text-slate-400"></i>
                </button>
                <button onclick="openFilePicker()" class="p-2 bg-sky-500 hover:bg-sky-600 rounded-full transition-colors text-white shadow-lg shadow-sky-500/20">
                    <i class="ph-bold ph-plus text-xl"></i>
                </button>
            </div>
        </header>

        <!-- 雲端設定區塊 (預設隱藏) -->
        <div id="cloud-config" class="hidden absolute top-16 left-4 right-4 bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-2xl z-50 animate-in fade-in slide-in-from-top-4 duration-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center gap-2 text-sky-400">
                    <i class="ph-bold ph-github-logo"></i> GitHub 同步設定
                </h3>
                <button onclick="toggleCloudConfig()" class="text-slate-400"><i class="ph-bold ph-x"></i></button>
            </div>
            <div class="space-y-3 shrink-0">
                <input type="password" id="gh-token" placeholder="GitHub Token (Classic)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                <input type="text" id="gh-repo" placeholder="帳號/儲存庫 (例: user/my-books)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                <input type="text" id="gh-path" placeholder="檔案路徑 (預設: data.json)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                <button onclick="saveConfig()" class="w-full bg-sky-500 hover:bg-sky-600 py-2 rounded-lg font-bold text-sm transition-all active:scale-95">儲存並同步</button>
            </div>
            <p class="text-[10px] text-slate-500 mt-2">設定後書籍清單將自動與 GitHub 私人儲存庫保持一致。</p>
        </div>

        <!-- 檔案選擇器 (隱藏) -->
        <input type="file" id="file-picker" accept=".txt,.epub" class="hidden" onchange="handleFileSelect(event)">

        <!-- 書架列表區 -->
        <main id="library" class="flex-1 overflow-y-auto p-4 no-scrollbar">
            <div id="book-list" class="grid grid-cols-2 gap-4">
                <!-- 書籍動態插入處 -->
            </div>
            
            <!-- 版本與維護資訊 -->
            <div class="mt-12 mb-8 text-center">
                <p class="text-[10px] text-slate-700 tracking-widest font-mono uppercase">StarReader System</p>
                <p class="text-[10px] text-slate-700 font-mono" id="version-display">v0.0.0</p>
            </div>
            
            <!-- 空狀態 -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-slate-500 py-20">
                <i class="ph ph-books text-6xl mb-4"></i>
                <p>書架上空空如也</p>
                <button onclick="openFilePicker()" class="mt-4 text-sky-400 underline">立即加入第一本書</button>
            </div>
        </main>

        <!-- 閱讀器 UI (滿版疊加) -->
        <div id="reader" class="hidden fixed inset-0 bg-slate-900 z-[100] flex flex-col transition-colors duration-300">
            <!-- 模擬亮度遮罩 (透過透明黑背景達成) -->
            <div id="brightness-overlay" class="pointer-events-none fixed inset-0 bg-black/0 z-[110]"></div>

            <header id="reader-header" class="flex items-center justify-between px-4 py-3 bg-slate-800/80 backdrop-blur-md shrink-0 z-[105]">
                <button onclick="closeReader()" class="flex items-center gap-1 text-slate-300">
                    <i class="ph-bold ph-caret-left"></i> 返回
                </button>
                <div class="flex items-center gap-4">
                    <span id="reader-title" class="text-xs text-slate-400 truncate max-w-[120px]">書名...</span>
                    <button onclick="toggleReaderSettings()" class="p-2 bg-slate-700/50 rounded-full active:scale-95 transition-transform">
                        <i class="ph-bold ph-text-aa text-xl"></i>
                    </button>
                </div>
            </header>
            
            <!-- 閱讀偏好設定彈窗 -->
            <div id="reader-settings" class="hidden absolute bottom-0 left-0 right-0 bg-slate-800 rounded-t-3xl p-6 shadow-2xl z-[120] animate-in slide-in-from-bottom duration-300 border-t border-slate-700">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold flex items-center gap-2 px-1"><i class="ph-bold ph-sliders"></i> 閱讀設定</h3>
                    <button onclick="toggleReaderSettings()" class="text-slate-400 p-1"><i class="ph-bold ph-x text-lg"></i></button>
                </div>

                <div class="space-y-6">
                    <!-- 字體與行距 -->
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex-1">
                            <p class="text-[10px] text-slate-500 mb-2 uppercase tracking-wider font-bold">字體大小</p>
                            <div class="flex items-center bg-slate-900 rounded-lg p-1">
                                <button onclick="adjustFont(-1)" class="flex-1 p-2 active:bg-slate-800 rounded-md"><i class="ph ph-minus"></i></button>
                                <span id="font-size-label" class="flex-1 text-center font-bold text-sm">18</span>
                                <button onclick="adjustFont(1)" class="flex-1 p-2 active:bg-slate-800 rounded-md"><i class="ph ph-plus"></i></button>
                            </div>
                        </div>
                        <div class="flex-1">
                            <p class="text-[10px] text-slate-500 mb-2 uppercase tracking-wider font-bold">行間距</p>
                            <div class="flex items-center bg-slate-900 rounded-lg p-1">
                                <button onclick="setLineHeight(1.5)" class="flex-1 p-2 text-[10px] active:bg-slate-800 rounded-md">緊湊</button>
                                <button onclick="setLineHeight(1.9)" class="flex-1 p-2 text-[10px] border-x border-slate-800 active:bg-slate-800">舒適</button>
                                <button onclick="setLineHeight(2.4)" class="flex-1 p-2 text-[10px] active:bg-slate-800 rounded-md">寬鬆</button>
                            </div>
                        </div>
                    </div>

                    <!-- 主題選擇 -->
                    <div>
                        <p class="text-[10px] text-slate-500 mb-2 uppercase tracking-wider font-bold">色彩主題</p>
                        <div class="grid grid-cols-4 gap-3">
                            <button onclick="setReaderTheme('light')" class="h-10 rounded-xl bg-white border-2 border-transparent transition-all" id="theme-light"></button>
                            <button onclick="setReaderTheme('sepia')" class="h-10 rounded-xl bg-[#f4ecd8] border-2 border-transparent transition-all" id="theme-sepia"></button>
                            <button onclick="setReaderTheme('green')" class="h-10 rounded-xl bg-[#e3f0e7] border-2 border-transparent transition-all" id="theme-green"></button>
                            <button onclick="setReaderTheme('dark')" class="h-10 rounded-xl bg-slate-900 border-2 border-transparent transition-all" id="theme-dark"></button>
                        </div>
                    </div>

                    <!-- 亮度調節 -->
                    <div>
                        <div class="flex justify-between text-[10px] text-slate-500 mb-2 uppercase tracking-wider font-bold">
                            <span>虛擬亮度</span>
                            <span id="light-label">100%</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <i class="ph ph-sun-dim text-slate-500"></i>
                            <input type="range" min="20" max="100" value="100" class="flex-1 h-1 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-sky-500" oninput="updateBrightness(this.value)">
                            <i class="ph ph-sun text-slate-400"></i>
                        </div>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-700/50 text-[10px] text-center text-slate-500">
                    設定將自動同步至此裝置。
                </div>
            </div>
            
            <!-- TXT 內容區 -->
            <div id="txt-viewer" class="flex-1 overflow-y-auto p-6 reader-content no-scrollbar transition-all duration-300 hidden" style="white-space: pre-wrap; font-family: inherit;"></div>
            
            

            <!-- EPUB 內容區 -->
            <div id="epub-viewer" class="flex-1 hidden"></div>
            
            <!-- 閱讀導覽 (EPUB 專用) -->
            <footer id="epub-nav" class="hidden flex items-center justify-between px-6 py-4 bg-slate-900/50 backdrop-blur-sm shrink-0 border-t border-white/5">
                <button onclick="prevPage()" class="p-2 active:bg-white/10 rounded-full"><i class="ph-bold ph-arrow-left text-xl"></i></button>
                <span id="page-info" class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">載入中...</span>
                <button onclick="nextPage()" class="p-2 active:bg-white/10 rounded-full"><i class="ph-bold ph-arrow-right text-xl"></i></button>
            </footer>
        </div>

    </div>

    <script>
        // 0. 版本資訊
        const APP_VERSION = "v0.2.3";

        /** 
         * 1. IndexedDB 核心邏輯 - 解決大型檔案儲存問題
         * LocalStorage 只有 5MB, IndexedDB 可以存 GB 等級的數據
         */
        const DB_NAME = 'StarReaderDB';
        const STORE_BOOKS = 'books';
        let dbInstance = null;

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_BOOKS)) {
                        db.createObjectStore(STORE_BOOKS, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function dbSaveBook(book) {
            return new Promise((resolve, reject) => {
                const tx = dbInstance.transaction(STORE_BOOKS, 'readwrite');
                const store = tx.objectStore(STORE_BOOKS);
                store.put(book);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject();
            });
        }

        async function dbGetBook(id) {
            return new Promise((resolve, reject) => {
                const tx = dbInstance.transaction(STORE_BOOKS, 'readonly');
                const store = tx.objectStore(STORE_BOOKS);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject();
            });
        }

        async function dbDeleteBook(id) {
            return new Promise((resolve, reject) => {
                const tx = dbInstance.transaction(STORE_BOOKS, 'readwrite');
                const store = tx.objectStore(STORE_BOOKS);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        // 2. 初始化與清單資料
        let records = []; // 僅存 MetaData (id, name, type, size, pos) 以確保效能
        let config = JSON.parse(localStorage.getItem('reader_config')) || { token: '', repo: '', path: 'data.json' };
        let settings = JSON.parse(localStorage.getItem('reader_settings')) || { fontSize: 18, lineHeight: 1.9, theme: 'dark', brightness: 100 };

        let currentEpub = null;
        let rendezvous = null;
        let currentBookId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            loadLocalRecords();
            renderLibrary();
            initSettings();
            applyReaderSettings();
            
            // 停用自動同步，改由使用者手動點擊
            // if (config.token && config.repo) {
            //     syncCloudFiles(true); 
            // }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 新版本已下載完成
                                if (confirm('星閱有新版本 (v0.2.0)，是否立即重整以應用更新？')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                }).catch(err => console.log('SW fail:', err));

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            } // 這裡原本就有

            // === 👇 新增這段：監聽 TXT 捲動事件，記憶閱讀斷點 ===
            const txtViewerElement = document.getElementById('txt-viewer');
            let scrollTimer;
            if (txtViewerElement) {
                txtViewerElement.addEventListener('scroll', () => {
                    if (scrollTimer) clearTimeout(scrollTimer);
                    scrollTimer = setTimeout(() => {
                        if (currentBookId) {
                            const book = records.find(b => b.id === currentBookId);
                            if (book && book.type === 'txt') {
                                const scrollHeight = txtViewerElement.scrollHeight - txtViewerElement.clientHeight;
                                if (scrollHeight > 0) {
                                    book.lastReadPos = txtViewerElement.scrollTop / scrollHeight;
                                    book.lastReadTime = Date.now();
                                    saveLocalRecords();
                                }
                            }
                        }
                    }, 500);
                }, { passive: true });
            }
            // === 👆 新增結束 ===

        }); // 這裡原本就有
        

        function initSettings() {
            document.getElementById('gh-token').value = config.token || '';
            document.getElementById('gh-repo').value = config.repo || '';
            document.getElementById('gh-path').value = config.path || 'data.json';
            document.getElementById('version-display').innerText = APP_VERSION;
        }

        // 3. 檔案選擇與【智慧編碼偵測】
        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 重置 input，確保可以重複選取同一檔案
            const fileInput = e.target;

            // 處理載入中的 UI
            const loadingHtml = `<div id="loading-indicator" class="col-span-2 flex flex-col items-center justify-center py-16 animate-in fade-in duration-300"><i class="ph-bold ph-circle-notch animate-spin text-5xl mb-4 text-sky-500"></i><p class="text-slate-300 font-bold tracking-wide">正在解析書籍檔案...</p><p class="text-xs text-slate-500 mt-2">大型檔案可能需要幾秒鐘，請耐心等候</p></div>`;
            document.getElementById('book-list').insertAdjacentHTML('afterbegin', loadingHtml);

            // 讓 UI 有時間渲染載入畫面
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            
            // 再給予一點點時間確保 DOM 已經更新到畫面上
            await new Promise(resolve => setTimeout(resolve, 50));

            const reader = new FileReader();
            
            reader.onload = async (event) => {
                // 讀取完成後，再讓出一次執行緒
                await new Promise(resolve => setTimeout(resolve, 10));

                try {
                    const isEpub = file.name.toLowerCase().endsWith('.epub');
                    let contentData = event.target.result;

                    // 【解決亂碼】：如果是 TXT，偵測編碼
                    if (!isEpub) {
                        const uint8 = new Uint8Array(contentData);

                        // 擷取前 10KB 位元組進行編碼探測，兼顧精準度與記憶體效能
                        const sampleSize = Math.min(uint8.length, 1024 * 10);
                        let binaryString = '';
                        for (let i = 0; i < sampleSize; i++) {
                            binaryString += String.fromCharCode(uint8[i]);
                        }

                        // 使用 jschardet 偵測真實編碼
                        const detected = jschardet.detect(binaryString);
                        let encoding = 'utf-8'; // 預設防線

                        if (detected && detected.encoding) {
                            encoding = detected.encoding.toLowerCase();
                            // 防呆機制：由於 TXT 缺乏檔頭，jschardet 有時會將純 Big5 誤判為歐洲語系
                            if (encoding.includes('windows-125') || encoding === 'ascii') {
                                encoding = 'big5';
                            }
                            console.log(`[系統] 偵測到檔案編碼為: ${encoding} (信心水準: ${detected.confidence})`);
                        }

                        try {
                            // 依據偵測出來的結果精確轉換字串
                            contentData = new TextDecoder(encoding).decode(uint8);
                        } catch (err) {
                            console.warn('[系統] 偵測編碼轉譯失敗，執行終極防線：強制轉換為 Big5');
                            contentData = new TextDecoder('big5').decode(uint8);
                        }
                    }

                    const bookId = Date.now().toString();
                    const newBookMetadata = {
                        id: bookId,
                        name: file.name.replace('.txt', '').replace('.epub', ''),
                        type: isEpub ? 'epub' : 'txt',
                        size: file.size,
                        lastReadPos: 0,
                        lastReadTime: Date.now(),
                        addedAt: new Date().toISOString()
                    };

                    // 將重型數據存入 IndexedDB (這是最佔效能的地方，分段非同步執行)
                    await dbSaveBook({ id: bookId, data: contentData });

                    records.push(newBookMetadata);
                    saveLocalRecords();
                    
                    // 確保完成後更新 UI
                    renderLibrary();
                } catch (err) {
                    console.error("處理檔案時發生錯誤:", err);
                    alert("載入檔案失敗，請重試！");
                    renderLibrary(); // 移除載入畫面
                } finally {
                    fileInput.value = ''; // 清空
                }
            };

            reader.onerror = () => {
                console.error("FileReader 錯誤");
                alert("讀取檔案失敗！");
                renderLibrary();
                fileInput.value = '';
            };

            // 以 ArrayBuffer 讀取原始數據，方便後續 TextDecoder 處理
            reader.readAsArrayBuffer(file);
        }

        // 4. 下載與列表
        function saveLocalRecords() {
            // LocalStorage 只存 Meta (不含內容)，所以不會爆掉
            localStorage.setItem('reader_records', JSON.stringify(records));
        }

        function loadLocalRecords() {
            const stored = localStorage.getItem('reader_records');
            if (stored) records = JSON.parse(stored);
        }

        function renderLibrary() {
            const list = document.getElementById('book-list');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';
            if (records.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            records.forEach(book => {
                const card = document.createElement('div');
                card.className = 'bg-slate-800 rounded-xl p-4 flex flex-col gap-3 border border-slate-700 active:scale-95 transition-transform duration-200 cursor-pointer relative group';
                card.onclick = () => openReader(book);
                
                let progressText = '未開始';
                if (book.notDownloaded) progressText = '<span class="text-yellow-400 font-bold"><i class="ph-bold ph-cloud-arrow-down"></i> 待下載</span>';
                else if (book.lastReadPos) progressText = '閱讀中';
                
                card.innerHTML = `
                    <div class="h-24 bg-slate-700/50 rounded flex items-center justify-center relative overflow-hidden">
                        <i class="ph-bold ${book.type === 'epub' ? 'ph-books' : 'ph-file-text'} text-3xl ${book.notDownloaded ? 'text-slate-500' : 'text-sky-400/50'}"></i>
                        
                        <!-- 狀態小點 -->
                        ${book.lastReadPos && !book.notDownloaded ? '<div class="absolute top-2 right-2 h-2 w-2 bg-sky-500 rounded-full shadow-[0_0_8px_#3b82f6]"></div>' : ''}
                        
                        <!-- 加大的刪除按鈕 (Hit Area: 44x44px 以上) -->
                        <button onclick="event.stopPropagation(); deleteBook('${book.id}')" 
                                class="absolute bottom-0 right-0 p-3 bg-red-500/20 hover:bg-red-500/40 text-red-500 rounded-tl-xl transition-colors border-t border-l border-red-500/20 active:scale-110"
                                title="刪除書籍">
                            <i class="ph-bold ph-trash text-lg"></i>
                        </button>
                    </div>
                    <div class="space-y-1">
                        <h4 class="text-sm font-bold truncate pr-6">${book.name}</h4>
                        <div class="flex justify-between items-center text-[10px]">
                             <p class="text-slate-500">${(book.size / 1024).toFixed(1)} KB</p>
                             <p class="text-sky-400/70 font-bold">${progressText}</p>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function deleteBook(id) {
            if(!confirm('確定要從裝置與雲端完全刪除這份檔案嗎？')) return;
            
            // 1. 取得準備刪除的書籍資訊 (需要知道副檔名以刪除雲端實體檔案)
            const bookToDelete = records.find(b => b.id === id);
            if (!bookToDelete) return;

            // 2. 移除本地 IndexedDB 與清單
            records = records.filter(b => b.id !== id);
            await dbDeleteBook(id);
            saveLocalRecords();
            renderLibrary();

            // 3. 同步刪除 GitHub 雲端檔案與更新目錄
            if (config.token && config.repo) {
                const icon = document.getElementById('sync-icon');
                if(icon) icon.classList.add('ph-spinner', 'animate-spin');
                
                try {
                    const dirPath = (config.path || 'data.json').split('/').slice(0, -1).join('/');
                    const ext = bookToDelete.type === 'epub' ? 'epub' : 'txt';
                    const filePath = dirPath ? `${dirPath}/${id}.${ext}` : `${id}.${ext}`;
                    const apiUrl = `https://api.github.com/repos/${config.repo}/contents`;

                    // A. 刪除雲端實體檔案
                    const fileRes = await fetch(`${apiUrl}/${filePath}`, { headers: { 'Authorization': `token ${config.token}` } });
                    if (fileRes.ok) {
                        const fileData = await fileRes.json();
                        await fetch(`${apiUrl}/${filePath}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Delete book ${bookToDelete.name}`, sha: fileData.sha })
                        });
                    }

                    // B. 覆寫更新雲端的 data.json (移除該書的紀錄)
                    const metaPath = config.path || 'data.json';
                    let metaSha = null;
                    const metaRes = await fetch(`${apiUrl}/${metaPath}`, { headers: { 'Authorization': `token ${config.token}` } });
                    if (metaRes.ok) {
                        const metaData = await metaRes.json();
                        metaSha = metaData.sha;
                    }

                    const content = btoa(unescape(encodeURIComponent(JSON.stringify(records))));
                    await fetch(`${apiUrl}/${metaPath}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "Sync Bookmarks after Deletion", content: content, sha: metaSha })
                    });

                    console.log('雲端紀錄已連動刪除');
                } catch (e) {
                    console.error('雲端刪除失敗:', e);
                } finally {
                    if(icon) icon.classList.remove('ph-spinner', 'animate-spin');
                }
            }
        }

        // 5. 閱讀器 logic
        async function openReader(bookMeta) {
            currentBookId = bookMeta.id;
            
            if (bookMeta.notDownloaded) {
                alert('正在從雲端下載書籍，請稍候...');
                const dirPath = (config.path || 'data.json').split('/').slice(0, -1).join('/');
                const ext = bookMeta.type === 'epub' ? 'epub' : 'txt';
                const filePath = dirPath ? `${dirPath}/${bookMeta.id}.${ext}` : `${bookMeta.id}.${ext}`;
                const apiUrl = `https://api.github.com/repos/${config.repo}/contents/${filePath}`;
                
                try {
                    const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3.raw' } });
                    if (!res.ok) throw new Error('Download failed');
                    const buffer = await res.arrayBuffer();
                    let fileData = buffer;
                    if (bookMeta.type === 'txt') {
                        fileData = new TextDecoder('utf-8').decode(buffer);
                    }
                    await dbSaveBook({ id: bookMeta.id, data: fileData });
                    bookMeta.notDownloaded = false;
                    saveLocalRecords();
                    renderLibrary();
                } catch(e) {
                    console.error(e);
                    alert('下載失敗，可能檔案不存在或網路中斷。');
                    return;
                }
            }

            // 從 IndexedDB 撈取大型內容
            const bookContent = await dbGetBook(bookMeta.id);
            if (!bookContent) {
                alert('找不到書籍內容，請重新載入檔案。');
                return;
            }

            const readerEl = document.getElementById('reader');
            const txtViewer = document.getElementById('txt-viewer');
            const epubCont = document.getElementById('epub-viewer');
            const epubNav = document.getElementById('epub-nav'); // [修正點1]：補上遺漏的導覽列 DOM 綁定

            document.getElementById('reader-title').innerText = bookMeta.name;
            readerEl.classList.remove('hidden');
            txtViewer.classList.add('hidden');
            epubCont.classList.add('hidden');
            epubNav.classList.add('hidden'); // [修正點2]：切換檔案時，確保底部翻頁列預設為隱藏狀態


            applyReaderSettings();

            if (bookMeta.type === 'txt') {
                txtViewer.classList.remove('hidden');
                // 隱藏 TXT 專用的底部翻頁導覽列，因為我們要改為上下捲動
               
                
                // 【關鍵修正】：取消切割 (Chunking)，改為一次性高效能純文字渲染
                const formattedText = bookContent.data
                    .split('\n')
                    .map(p => p.trim())
                    .filter(p => p.length > 0)
                    .join('\n\n'); 
                    
                txtViewer.textContent = formattedText;

                // 恢復上次閱讀的捲動位置 (支援百分比進度以適應不同手機螢幕)
                setTimeout(() => {
                    const maxScroll = txtViewer.scrollHeight - txtViewer.clientHeight;
                    let targetScroll = 0;
                    if (typeof bookMeta.lastReadPos === 'number') {
                        if (bookMeta.lastReadPos <= 1) { // 預期為百分比 (0~1)
                            targetScroll = maxScroll * bookMeta.lastReadPos;
                        } else { // 舊版像素資料，相容處理
                            targetScroll = bookMeta.lastReadPos;
                        }
                    }
                    txtViewer.scrollTop = Math.max(0, targetScroll); 
                }, 100);
            } else {
                epubCont.classList.remove('hidden');
                epubNav.classList.remove('hidden');
                await loadEpub(bookContent.data, bookMeta.lastReadPos);
            }
        }

        async function loadEpub(data, savedCfi) {
            const epubCont = document.getElementById('epub-viewer');
            epubCont.innerHTML = '';
            currentEpub = ePub(data);
            rendezvous = currentEpub.renderTo("epub-viewer", { width: "100%", height: "100%", flow: "paginated", manager: "default" });

            rendezvous.themes.register({
                light: { body: { "color": "#334155 !important", "background": "transparent !important" } },
                sepia: { body: { "color": "#5b4636 !important", "background": "transparent !important" } },
                green: { body: { "color": "#2d3e33 !important", "background": "transparent !important" } },
                dark: { body: { "color": "#cbd5e1 !important", "background": "transparent !important" } }
            });

            await rendezvous.display(savedCfi || undefined);
            rendezvous.themes.fontSize(settings.fontSize + 'px');
            rendezvous.themes.select(settings.theme);

            rendezvous.on("relocated", (location) => {
                document.getElementById('page-info').innerText = `${Math.floor(location.start.percentage * 100)}%`;
                if (currentBookId) {
                    const b = records.find(x => x.id === currentBookId);
                    if (b) {
                        b.lastReadPos = location.start.cfi;
                        b.lastReadTime = Date.now();
                        saveLocalRecords();
                    }
                }
            });
        }

        function prevPage() { if (rendezvous) rendezvous.prev(); }
        function nextPage() { if (rendezvous) rendezvous.next(); }

        function closeReader() {
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('reader-settings').classList.add('hidden');
            const txtViewer = document.getElementById('txt-viewer');
            if (txtViewer) txtViewer.classList.add('hidden');
            currentBookId = null;
            if (currentEpub) {
                currentEpub.destroy();
                currentEpub = null;
            }
            renderLibrary();
        }

        function openFilePicker() {
            document.getElementById('file-picker').click();
        }

        function toggleCloudConfig() {
            const el = document.getElementById('cloud-config');
            el.classList.toggle('hidden');
        }

        function toggleReaderSettings() {
            const el = document.getElementById('reader-settings');
            el.classList.toggle('hidden');
        }

        function saveConfig() {
            config.token = document.getElementById('gh-token').value.trim();
            config.repo = document.getElementById('gh-repo').value.trim();
            config.path = document.getElementById('gh-path').value.trim() || 'data.json';
            localStorage.setItem('reader_config', JSON.stringify(config));
            toggleCloudConfig();
            alert('設定已儲存！');
            syncCloudFiles();
        }

        function applyReaderSettings() {
            const txtViewer = document.getElementById('txt-viewer');
            const reader = document.getElementById('reader');
            const header = document.getElementById('reader-header');
            const nav = document.getElementById('epub-nav');
            const overlay = document.getElementById('brightness-overlay');
            
            if (txtViewer) {
                txtViewer.style.fontSize = settings.fontSize + 'px';
                txtViewer.style.lineHeight = settings.lineHeight;
            }
            document.getElementById('font-size-label').innerText = settings.fontSize;
            overlay.style.backgroundColor = `rgba(0,0,0,${(100 - settings.brightness) / 100})`;
            document.getElementById('light-label').innerText = settings.brightness + '%';

            const themes = {
                light: { bg: '#ffffff', text: '#334155', header: '#f1f5f9', nav: '#f1f5f9' },
                sepia: { bg: '#f4ecd8', text: '#5b4636', header: '#e8dec2', nav: '#e8dec2' },
                green: { bg: '#e3f0e7', text: '#2d3e33', header: '#d4e6d9', nav: '#d4e6d9' },
                dark: { bg: '#0f172a', text: '#cbd5e1', header: '#1e293b', nav: '#1e293b' }
            };

            const current = themes[settings.theme];
            reader.style.backgroundColor = current.bg;
            if (txtViewer) txtViewer.style.color = current.text;
            header.style.backgroundColor = current.header;
            if (nav) nav.style.backgroundColor = current.nav;

            ['light', 'sepia', 'green', 'dark'].forEach(t => {
                const btn = document.getElementById('theme-' + t);
                if (btn) btn.style.borderColor = (settings.theme === t) ? '#3b82f6' : 'transparent';
            });

            if (rendezvous) {
                rendezvous.themes.fontSize(settings.fontSize + 'px');
                rendezvous.themes.register({
                    light: { body: { "color": "#334155 !important", "background": "transparent !important", "line-height": settings.lineHeight + " !important" } },
                    sepia: { body: { "color": "#5b4636 !important", "background": "transparent !important", "line-height": settings.lineHeight + " !important" } },
                    green: { body: { "color": "#2d3e33 !important", "background": "transparent !important", "line-height": settings.lineHeight + " !important" } },
                    dark:  { body: { "color": "#cbd5e1 !important", "background": "transparent !important", "line-height": settings.lineHeight + " !important" } }
                });
                rendezvous.themes.select(settings.theme);
            }
        }

        function adjustFont(delta) {
            settings.fontSize += delta;
            if (settings.fontSize < 12) settings.fontSize = 12;
            if (settings.fontSize > 40) settings.fontSize = 40;
            saveSettings();
        }

        function setLineHeight(val) {
            settings.lineHeight = val;
            saveSettings();
        }

        function setReaderTheme(t) {
            settings.theme = t;
            saveSettings();
        }

        function updateBrightness(val) {
            settings.brightness = val;
            applyReaderSettings();
            localStorage.setItem('reader_settings', JSON.stringify(settings));
        }

        function saveSettings() {
            localStorage.setItem('reader_settings', JSON.stringify(settings));
            applyReaderSettings();
        }

        async function syncCloudFiles(silent = false) {
            if (!config.token || !config.repo) {
                if (!silent) alert('請先在設定中填寫 GitHub Token 與 Repo');
                return;
            }
            const icon = document.getElementById('sync-icon');
            icon.classList.add('ph-spinner', 'animate-spin');
            
            const dirPath = (config.path || 'data.json').split('/').slice(0, -1).join('/');
            const metaPath = config.path || 'data.json';
            const apiUrl = `https://api.github.com/repos/${config.repo}/contents`;

            try {
                // 1. Fetch Remote Metadata
                let remoteRecords = [];
                let metaSha = null;
                const getRes = await fetch(`${apiUrl}/${metaPath}`, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                
                if (getRes.ok) {
                    const existing = await getRes.json();
                    metaSha = existing.sha;
                    const decoded = decodeURIComponent(atob(existing.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                    remoteRecords = JSON.parse(decoded);
                }

                // 2. Merge & Download missing books
                for (const remote of remoteRecords) {
                    const local = records.find(b => b.id === remote.id);
                    if (local) {
                        const remoteTime = remote.lastReadTime || 0;
                        const localTime = local.lastReadTime || 0;
                        
                        // 根據最後閱讀時間決定要保留誰的進度 (解決跨裝置進度互相覆蓋問題)
                        if (remoteTime > localTime) {
                            local.lastReadPos = remote.lastReadPos;
                            local.lastReadTime = remoteTime;
                        } else if (!local.lastReadTime && !remote.lastReadTime && remote.lastReadPos !== undefined && remote.lastReadPos !== local.lastReadPos) {
                            // 舊版無時間戳記的降級處理
                            local.lastReadPos = remote.lastReadPos;
                        }
                    } else {
                        records.push({ ...remote, notDownloaded: true });
                    }
                }
                
                saveLocalRecords();
                renderLibrary();

                // 3. Upload missing books from local
                for (const local of records) {
                    if (local.notDownloaded) continue;
                    if (!local.uploaded) {
                        const ext = local.type === 'epub' ? 'epub' : 'txt';
                        const filePath = dirPath ? `${dirPath}/${local.id}.${ext}` : `${local.id}.${ext}`;
                        
                        try {
                            const check = await fetch(`${apiUrl}/${filePath}`, { method: 'HEAD', headers: { 'Authorization': `token ${config.token}` } });
                            if (!check.ok) {
                                const bookData = await dbGetBook(local.id);
                                if (bookData) {
                                    const base64Str = await new Promise((resolve) => {
                                        const blob = new Blob([bookData.data]);
                                        const reader = new FileReader();
                                        reader.onload = () => resolve(reader.result.split(',')[1]);
                                        reader.readAsDataURL(blob);
                                    });
                                    const uploadRes = await fetch(`${apiUrl}/${filePath}`, {
                                        method: 'PUT',
                                        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ message: `Upload book ${local.name}`, content: base64Str })
                                    });

                                    // 【關鍵修正】：強制驗證上傳結果
                                    if (!uploadRes.ok) {
                                        const err = await uploadRes.json();
                                        console.error('上傳遭拒絕:', err);
                                        alert(`《${local.name}》實體檔案上傳至雲端失敗。\n原因: 檔案過大或 API 限制。本機仍可閱讀，但無法跨裝置下載。`);
                                        continue; // 中斷此書的標記，保留未上傳狀態
                                    }
                                }
                            }
                            // 只有在確認檔案已經存在於雲端，或剛剛成功上傳後，才標記為 true
                            local.uploaded = true; 
                        } catch (err) {
                            console.error('File upload err:', err);
                            continue; // 發生網路錯誤，中斷標記
                        }
                    }
                }

                saveLocalRecords();

                // 4. Update Meta
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(records))));
                await fetch(`${apiUrl}/${metaPath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Sync Bookmarks", content: content, sha: metaSha })
                });

                if (!silent) alert('同步完成！\n若有新書未下載，點擊該書面將自動下載。');
                
            } catch (e) {
                console.error('GH Sync Error:', e);
                if (!silent) alert('同步失敗，可能授權過期或網路問題。');
            } finally {
                icon.classList.remove('ph-spinner', 'animate-spin');
                renderLibrary();
            }
        }
    </script>
